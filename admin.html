<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburg RP - Admin</title>
    <meta name="description" content="Hamburg RP Admin Panel">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.youtube-nocookie.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <iframe class="video-background" src="https://www.youtube-nocookie.com/embed/UNOmaFs6KaY?autoplay=1&mute=1&loop=1&playlist=UNOmaFs6KaY&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&playsinline=1&iv_load_policy=3" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <nav class="top-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="updates.html" class="nav-link">Updates</a>
        <a href="social-media.html" class="nav-link">Socials</a>
        <a href="admin.html" class="nav-link active">Admin</a>
    </nav>

    <main class="container">
        <!-- Login Section -->
        <section id="login-section" class="admin-panel">
            <h2>Admin Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="admin-email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="admin-password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                <p id="login-error" class="error-text"></p>
            </form>
        </section>

        <!-- Dashboard Section (Hidden by default) -->
        <section id="dashboard-section" class="admin-panel" style="display: none; position: relative;">
            <button id="logout-btn" class="btn btn-secondary btn-sm" style="position: absolute; top: 1.5rem; right: 1.5rem;">Logout</button>
            <h2 style="margin-bottom: 2rem;">Website Configuration</h2>
            
            <div id="config-form">
                <div class="form-section">
                    <h3>Server & Links</h3>
                    <div class="form-group">
                        <label>Roblox Private Server Code</label>
                        <input type="text" id="config-ip" placeholder="Code">
                    </div>
                    <div class="form-group">
                        <label>Discord Invite Link</label>
                        <input type="text" id="config-discord" placeholder="https://discord.gg/...">
                    </div>
                </div>

                <div class="form-section">
                    <h3>Notifications</h3>
                    <div class="form-group toggle-row" style="margin-bottom: 10px;">
                        <label for="config-updates-badge">New Updates badge (gold glow on Updates tab)</label>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <label class="toggle-switch">
                                <input type="checkbox" id="config-updates-badge">
                                <span class="toggle-slider"></span>
                            </label>
                            <select id="config-updates-duration" style="display: none; width: auto; padding: 6px 12px; font-size: 0.9rem;">
                                <option value="1">1 uur</option>
                                <option value="24" selected>24 uur</option>
                                <option value="48">48 uur</option>
                                <option value="168">1 week</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Staff Members</h3>
                    <div id="staff-list">
                        <!-- Dynamic staff inputs -->
                    </div>
                    <button type="button" id="add-staff-btn" class="btn btn-secondary">+ Add Staff Member</button>
                </div>

                <div class="form-section">
                    <h3>Social Media</h3>
                    <div id="social-media-list">
                        <!-- Dynamic social media inputs -->
                    </div>
                    <button type="button" id="add-social-btn" class="btn btn-secondary">+ Add Social Media Video</button>
                </div>

                <div class="form-section" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
                    <h3>Updates</h3>
                    <div id="updates-list">
                        <!-- Dynamic update inputs -->
                    </div>
                    <button type="button" id="add-update-btn" class="btn btn-secondary">+ Add Update</button>
                </div>

                <p id="save-status" class="success-text"></p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        Ontworpen door <a href="https://accounts.wonderdev.nl" target="_blank">wonderlight studios</a>
    </footer>

    <script type="module" src="admin.js"></script>
</body>
</html>
