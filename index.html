<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburg RP</title>
    <meta name="description" content="Hamburg RP Official Website">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.youtube-nocookie.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <iframe class="video-background" src="https://www.youtube-nocookie.com/embed/UNOmaFs6KaY?autoplay=1&mute=1&loop=1&playlist=UNOmaFs6KaY&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&playsinline=1&iv_load_policy=3" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>

    <nav class="top-nav">
        <a href="index.html" class="nav-link active">Home</a>
        <a href="updates.html" class="nav-link">Updates</a>
        <a href="social-media.html" class="nav-link">Socials</a>
        <a href="admin.html" class="nav-link">Admin</a>
    </nav>

    <main class="container">
        <section class="hero-bar">
            <div class="widget copyable" data-copy="Roblox Hamburg RP" data-type="ip">
                <div class="widget-icon">
                    <i class="fa-solid fa-car"></i>
                </div>
                <div class="widget-text">
                    <h2>SERVER CODE</h2>
                    <p>Click to copy</p>
                </div>
                <div class="tooltip ip-tooltip">COPIED!</div>
            </div>

            <div class="hero-logo">
                <img src="Media/Icons/Hamburg%20RP%20Logo.png" alt="Hamburg RP Logo" class="logo">
            </div>

            <div class="widget copyable" data-copy="https://discord.gg/ZbnKDTS7kx" data-type="discord">
                <div class="widget-icon discord-icon">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <div class="widget-text">
                    <h2>JOIN OUR DISCORD</h2>
                    <p id="discord-count">Loading members...</p>
                </div>
                <div class="tooltip discord-tooltip">LINK COPIED!</div>
            </div>
        </section>

        <section class="owners-scroller">
            <div class="owners-container" id="staff-container">
                <!-- Staff members injected via JS -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        Ontworpen door <a href="https://accounts.wonderdev.nl" target="_blank">wonderlight studios</a>
    </footer>

    <script type="module" src="script.js"></script>
</body>

</html>
